name: Deploy Prez Container App

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "prez/**"
      - ".github/workflows/deploy-prez.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-prez-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and publish Prez
        id: image
        env:
          REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          REGISTRY_GROUP: ${{ vars.AZURE_CONTAINER_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          server="$(az acr show --name "$REGISTRY" --resource-group "$REGISTRY_GROUP" --query loginServer --output tsv)"
          image="$server/resources-bdr-prez:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr login --name "$REGISTRY" --resource-group "$REGISTRY_GROUP"
          docker build --platform linux/amd64 --tag "$image" .
          docker push "$image"
          digest="$(az acr repository show --name "$REGISTRY" --resource-group "$REGISTRY_GROUP" --image "${image#*/}" --query digest --output tsv)"
          echo "reference="$image"" >> "$GITHUB_OUTPUT"